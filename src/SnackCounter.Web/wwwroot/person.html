<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snack Person Chat</title>
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px; display: flex; flex-direction: column; height: calc(100vh - 58px); }
  #chat { flex: 1; overflow-y: auto; padding: 8px 0; }
  .msg { max-width: 85%; }
  .msg.user { margin-left: auto; background: var(--accent); color: var(--accent-text); border: none; }
  .msg.user .meta { color: rgba(255,255,255,.75); }
  form { display: flex; gap: 6px; }
  form input { flex: 1; }
  #me { font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Snack chat</h1>
  <label>I am <select id="who" onchange="choose()"></select></label>
  <span id="me" class="muted"></span>
  <span class="muted" id="now"></span>
</header>

<main>
  <div id="chat"></div>
  <div class="chips" id="quick"></div>
  <form onsubmit="event.preventDefault(); say(text.value); text.value='';">
    <input id="text" placeholder="Type a message, e.g.  done 850 chips, cola" autocomplete="off">
    <label class="muted" title="Receipt photo or PDF (optional in the simulator)">📎 <input id="receipt" type="file" accept="image/*,.pdf" style="width:150px"></label>
    <button class="primary">Send</button>
  </form>
  <p class="muted" style="font-size:12px">Time moves only from the test console. This page shows only what this person would see in the real chat app.</p>
</main>

<script>
// Who this page is for: an employee id, or "contact:Oslo" for an office contact. Taken from ?id=...
var me = new URLSearchParams(location.search).get('id') || '';
var lastShown = -1;

function esc(text) {
  var d = document.createElement('div');
  d.textContent = text == null ? '' : String(text);
  return d.innerHTML;
}

function choose() {
  me = document.getElementById('who').value;
  history.replaceState(null, '', '?id=' + encodeURIComponent(me));
  lastShown = -1;
  refresh();
}

function isContact() { return me.indexOf('contact:') === 0; }

// What this person types goes in as "<id>: <text>", the same command the terminal simulator takes.
function say(text) {
  if (!text || !text.trim() || isContact()) return;
  // Receipt: only the file name is sent; the simulator does not store the file. Optional here.
  var file = document.getElementById('receipt');
  if (text.trim().indexOf('done') === 0 && file.files.length > 0) {
    text += ' receipt:' + file.files[0].name;
    file.value = '';
  }
  fetch('/api/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ line: me + ': ' + text }) })
    .then(function (r) { return r.json(); })
    .then(render);
}

function render(s) {
  document.getElementById('now').textContent = s.now;

  // Picker: people grouped by home office, each with who they are, plus each office contact.
  // e.g. "Henrik · Volunteer · visiting Bengaluru"   "Lars · Regular · Admin"
  var who = document.getElementById('who');
  var html = '';
  for (var b = 0; b < s.budgets.length; b++) {
    var office = s.budgets[b].office;
    html += '<optgroup label="' + esc(office) + ' employees">';
    for (var i = 0; i < s.people.length; i++) {
      var e = s.people[i];
      if (e.homeOffice !== office) continue;
      var label = e.name + ' · ' + (e.isVolunteer ? 'Volunteer' : 'Regular') + (e.isAdmin ? ' · Admin' : '');
      if (!e.available) label += ' · away until ' + e.awayUntil;
      else if (e.currentOffice !== e.homeOffice) label += ' · visiting ' + e.currentOffice;
      html += '<option value="' + esc(e.id) + '">' + esc(label) + '</option>';
    }
    html += '</optgroup>';
  }
  html += '<optgroup label="Office contacts (receive warnings)">';
  for (var c = 0; c < s.budgets.length; c++) html += '<option value="contact:' + esc(s.budgets[c].office) + '">' + esc(s.budgets[c].office) + ' office contact</option>';
  html += '</optgroup>';
  if (who.getAttribute('data-html') !== html) { who.innerHTML = html; who.setAttribute('data-html', html); }
  if (!me) me = s.people[0].id;
  who.value = me;

  // A line about me.
  var info = '';
  for (var p = 0; p < s.people.length; p++) {
    var e = s.people[p];
    if (e.id === me) {
      info = 'Works in ' + e.homeOffice + (e.currentOffice !== e.homeOffice ? ' · visiting ' + e.currentOffice + ' until ' + e.visitingUntil : '')
        + (e.isVolunteer ? ' · Volunteer' : ' · Regular (never asked to refill)') + (e.isAdmin ? ' · Admin' : '')
        + (e.available ? '' : ' · Away until ' + e.awayUntil) + ' · Refills done: ' + e.refillsDone;
    }
  }
  document.getElementById('me').textContent = isContact() ? 'Gets budget warnings, escalations and rejected claims' : info;

  // Quick replies (none for an office contact: they only receive).
  var quick = '';
  if (!isContact()) {
    var words = ['empty', 'low', 'yes', 'no', 'full', 'done 850 chips, cola', 'away 3'];
    for (var w = 0; w < words.length; w++) quick += '<button onclick="say(\'' + words[w] + '\')">' + words[w] + '</button>';
  }
  document.getElementById('quick').innerHTML = quick;
  document.getElementById('text').disabled = isContact();

  // Only my messages: what I typed, what the bot sent me, and the simulator's answers to me.
  var mine = [];
  for (var j = 0; j < s.log.length; j++) {
    var m = s.log[j];
    if (m.kind === 'user' && m.from === me) mine.push(m);
    else if (m.kind !== 'user' && m.to === me) mine.push(m);
  }
  if (mine.length === lastShown) return;
  lastShown = mine.length;

  var out = '';
  for (var k = 0; k < mine.length; k++) {
    var x = mine[k];
    var text = x.kind === 'user' ? x.text.substring(x.text.indexOf(':') + 1).trim() : x.text;
    var label = x.kind === 'user' ? 'You' : (x.kind === 'bot' ? '🤖 Snack bot' : 'ℹ️ Simulator (not in the real chat)');
    out += '<div class="msg ' + x.kind + '"><div class="meta">' + label + ' · ' + esc(x.time) + ' UTC</div>' + esc(text) + '</div>';
  }
  var chat = document.getElementById('chat');
  chat.innerHTML = out || '<p class="muted">No messages yet.</p>';
  chat.scrollTop = chat.scrollHeight;
}

function refresh() {
  fetch('/api/state').then(function (r) { return r.json(); }).then(render).catch(function () {});
}
refresh();
setInterval(refresh, 1500); // see messages caused by other people or by time moving on
</script>
</body>
</html>
